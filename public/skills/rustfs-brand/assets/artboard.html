<!doctype html>
<!--
  RustFS artboard starter (rustfs-brand skill)
  1. Copy this file, set data-w / data-h on .ab (and the --w / --h variables) to the target size.
  2. Pick a surface class on .ab: t-ink (default stage), t-paper, t-white or t-signal.
  3. Compose inside .frame using the presets below. Sizes are in u (1/100 of the short side): calc(var(--u) * 8).
  4. Render: node scripts/render.mjs artboard.html out.png
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>RustFS artboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap">
<style>
  :root {
    --font-display: "Archivo", "HarmonyOS Sans SC", "Source Han Sans SC", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-sans: "Geist", "HarmonyOS Sans SC", "Source Han Sans SC", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --font-mono: "Geist Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  html, body { margin: 0; background: #2B313A; }
  body { padding: 40px; }

  /* Artboard: 1u = short side / 100, safe margin 7u */
  .ab {
    --w: 1200px; --h: 630px;
    --u: calc(min(var(--w), var(--h)) / 100);
    --m: calc(var(--u) * 7);
    position: relative; width: var(--w); height: var(--h); overflow: hidden;
    background: var(--bg); color: var(--fg); font-family: var(--font-sans);
    font-size: calc(var(--u) * 3); line-height: 1.4;
    -webkit-font-smoothing: antialiased;
  }
  /* Surfaces */
  .t-ink    { --bg: #0B0E14; --fg: #FFFFFF; --fg-2: #C4C9D2; --muted: #9AA0AC; --line: rgba(255,255,255,.14); --data: #0062FF; --parity: #FF5E14; --empty: rgba(255,255,255,.16); --logo: #FFFFFF; --brand: #5C99FF; }
  .t-paper  { --bg: #F4F6F9; --fg: #0B0E14; --fg-2: #424853; --muted: #5A616D; --line: rgba(11,14,20,.14); --data: #0062FF; --parity: #FF5E14; --empty: rgba(11,14,20,.16); --logo: #0062FF; --brand: #0062FF; }
  .t-white  { --bg: #FFFFFF; --fg: #0B0E14; --fg-2: #424853; --muted: #5A616D; --line: rgba(11,14,20,.12); --data: #0062FF; --parity: #FF5E14; --empty: rgba(11,14,20,.14); --logo: #0062FF; --brand: #0062FF; }
  .t-signal { --bg: #0062FF; --fg: #FFFFFF; --fg-2: rgba(255,255,255,.86); --muted: rgba(255,255,255,.74); --line: rgba(255,255,255,.3); --data: #FFFFFF; --parity: #0B0E14; --empty: rgba(255,255,255,.3); --logo: #FFFFFF; --brand: #FFFFFF; }

  /* Presets */
  .frame   { position: absolute; inset: var(--m); display: flex; flex-direction: column; justify-content: space-between; gap: calc(var(--u) * 3); }
  .row     { display: flex; align-items: center; justify-content: space-between; gap: calc(var(--u) * 3); }
  .logo    { display: block; height: calc(var(--u) * 4.25); width: auto; align-self: flex-start; fill: var(--logo); }
  .label   { font: 500 calc(var(--u) * 2.25)/1.2 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .label b { color: var(--fg); font-weight: 500; }
  .display { font-family: var(--font-display); font-stretch: 125%; font-weight: 800; line-height: .96; letter-spacing: -.02em; }
  .head    { font-family: var(--font-display); font-stretch: 112%; font-weight: 750; line-height: 1.06; letter-spacing: -.01em; text-wrap: balance; }
  .zh      { font-family: var(--font-display); font-weight: 800; line-height: 1.18; letter-spacing: 0; }
  .body    { font-size: calc(var(--u) * 3.25); line-height: 1.5; color: var(--fg-2); }
  .url     { font: calc(var(--u) * 2.5)/1.2 var(--font-mono); letter-spacing: .02em; color: var(--fg-2); }
  .stripe  { display: inline-flex; gap: .32em; font-size: calc(var(--u) * 1.75); }
  .stripe i { width: 1em; height: 1em; background: var(--data); }
  .stripe i.p { background: var(--parity); }
  .matrix  { position: absolute; }
  .matrix svg { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>

<!-- Example: release cover, 1200 × 630, Ink -->
<div class="ab t-ink" data-w="1200" data-h="630" style="--w:1200px;--h:630px">
  <div class="matrix" style="top:0;bottom:0;right:0;width:36%" data-matrix='{"cols":6,"rows":12,"k":4,"m":2,"seed":21,"mode":"tone","fit":"slice"}'></div>

      <span class="label">Release · <b>2026-10</b></span>
    </div>
    <div>
      <div class="display" style="font-size:calc(var(--u)*27);line-height:.82;letter-spacing:-.035em">
        <small style="display:block;font-size:.26em;line-height:1;letter-spacing:-.01em;margin:0 0 .35em .12em;color:var(--brand)">RustFS</small>1.0.1
      </div>
      <p class="body" style="margin:calc(var(--u)*4) 0 0;max-width:22em">Production-ready, S3-compatible object storage. Built in Rust, licensed Apache 2.0.</p>
    </div>
    <span class="url">github.com/rustfs/rustfs/releases</span>
  </div>
</div>

<script>
  // Shard matrix: columns = drives, rows = stripes, k data + m parity, parity shifts per stripe.
  function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296 } }
  const FADE = { l: (x) => x, r: (x) => 1 - x, t: (_, y) => y, b: (_, y) => 1 - y, tl: (x, y) => (x + y) / 2, br: (x, y) => 1 - (x + y) / 2, tr: (x, y) => (1 - x + y) / 2, bl: (x, y) => (x + 1 - y) / 2 }
  function matrix(el) {
    const o = Object.assign({ cols: 16, rows: 8, k: 12, m: 4, shift: 1, seed: 7, mode: "solid", density: 1, missing: 0, dead: [], gap: 0.2, fit: "meet", fade: "" }, JSON.parse(el.dataset.matrix || "{}"))
    const r = mulberry32(o.seed), n = o.k + o.m, cells = []
    for (let y = 0; y < o.rows; y++) for (let x = 0; x < o.cols; x++) {
      const pos = (((x - y * o.shift) % n) + n) % n
      let t = pos >= o.k ? "p" : "d", a = 1
      if (r() > o.density) t = "e"
      if (o.mode === "tone" && t === "d") { const q = r(); a = q < 0.5 ? 1 : q < 0.78 ? 0.6 : 0.34 }
      if (o.mode === "outline" && t === "d") t = "e"
      if (o.mode === "sparse" && t === "d" && r() < 0.55) t = "e"
      if (o.fade && FADE[o.fade]) { const f = FADE[o.fade](x / Math.max(1, o.cols - 1), y / Math.max(1, o.rows - 1)); const keep = Math.pow(Math.max(0, Math.min(1, f * 1.15)), 1.6); if (r() > keep) { t = "e"; a = keep > 0.18 ? 1 : 0 } }
      cells.push({ x, y, t, a })
    }
    cells.forEach((c) => { if (o.dead.includes(c.x) && c.a > 0) { c.t = "x"; c.a = 1 } })
    const pool = cells.filter((c) => c.t === "d" && c.a > 0.9)
    for (let i = 0; i < o.missing && pool.length; i++) pool.splice(Math.floor(r() * pool.length), 1)[0].t = "x"
    const cell = 10, g = cell * o.gap, step = cell + g, W = o.cols * step - g, H = o.rows * step - g
    const css = getComputedStyle(el)
    const col = { d: css.getPropertyValue("--data"), p: css.getPropertyValue("--parity"), e: css.getPropertyValue("--empty") }
    const svg = cells.filter((c) => c.a > 0.02).map((c) => {
      const x = c.x * step, y = c.y * step
      if (c.t === "d") return `<rect x="${x}" y="${y}" width="${cell}" height="${cell}" fill="${col.d}" opacity="${c.a}"/>`
      if (c.t === "p") return `<rect x="${x}" y="${y}" width="${cell}" height="${cell}" fill="${col.p}"/>`
      const dash = c.t === "x" ? ' stroke-dasharray="3 3"' : ""
      return `<rect x="${x + 0.5}" y="${y + 0.5}" width="${cell - 1}" height="${cell - 1}" fill="none" stroke="${c.t === "x" ? col.d : col.e}" stroke-width="1" vector-effect="non-scaling-stroke"${dash}/>`
    }).join("")
    const par = { slice: "xMidYMid slice", none: "none", left: "xMinYMid meet", right: "xMaxYMid meet" }[o.fit] || "xMidYMid meet"
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="${par}" xmlns="http://www.w3.org/2000/svg">${svg}</svg>`
  }
  document.querySelectorAll("[data-matrix]").forEach(matrix)
</script>
</body>
</html>
